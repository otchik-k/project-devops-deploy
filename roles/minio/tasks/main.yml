---
- name: Create directory for MinIO data
  ansible.builtin.file:
    path: "{{ minio_data_dir }}"
    state: directory
    mode: '0755'

- name: Pull MinIO image
  community.docker.docker_image:
    name: "{{ minio_image }}"
    source: pull

- name: Run MinIO container
  community.docker.docker_container:
    name: "{{ minio_container_name }}"
    image: "{{ minio_image }}"
    restart_policy: unless-stopped
    command: "server /data --console-address ':9001'"
    env:
      MINIO_ROOT_USER: "{{ minio_root_user }}"
      MINIO_ROOT_PASSWORD: "{{ minio_root_password }}"
      MINIO_DOMAIN: "minio" 
    volumes:
      - "{{ minio_data_dir }}:/data"
    networks:
      - name: "{{ minio_network_name }}"
        aliases:
          - "bulletin-board.minio"
    ports: "{{ minio_ports }}"
    state: started

- name: Wait for MinIO to be ready
  community.docker.docker_container_exec:
    container: "{{ minio_container_name }}"
    command: >
      /bin/sh -c "
      until curl -f http://localhost:9000/minio/health/live; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done
      "
  register: wait_result
  changed_when: false
  retries: 10
  delay: 2
  until: wait_result.stdout.find('200 OK') != -1 or wait_result.rc == 0
  # Примечание: curl вернет 0, если соединение успешно. 
  # Для простоты здесь проверяем rc==0.

- name: Create MinIO alias for mc
  community.docker.docker_container_exec:
    container: "{{ minio_container_name }}"
    command: >
      mc alias set local
      http://{{ minio_host | default('localhost') }}:{{ minio_api_port | default('9000') }}
      {{ minio_root_user }}
      {{ minio_root_password }}
  environment:
    MC_HOST_local: ""  # Сброс кэша алиасов, чтобы не было конфликтов

- name: Create S3 bucket 'bulletin-board'
  community.docker.docker_container_exec:
    container: "{{ minio_container_name }}"
    command: >
      mc mb --ignore-existing local/{{ storage_s3_bucket }}

- name: Create application user 'appuser'
  community.docker.docker_container_exec:
    container: "{{ minio_container_name }}"
    command: >
      mc admin user add local {{ s3_access_key }} {{ s3_secret_key }}

- name: Attach readwrite policy to appuser
  community.docker.docker_container_exec:
    container: "{{ minio_container_name }}"
    command: >
      mc admin policy attach local readwrite --user {{ s3_access_key }}
