---
- name: Ensure Docker is installed
  ansible.builtin.package:
    name: docker.io
    state: present

- name: Ensure the custom network exists
  docker_network:
    name: "{{ postgres_network_name }}"
    driver: bridge
    state: present

- name: Create directory for PostgreSQL data volume
  ansible.builtin.file:
    path: "{{ postgres_data_dir }}"
    state: directory
    mode: '0755'

- name: Pull the PostgreSQL Docker image
  docker_image:
    name: "{{ postgres_image }}"
    source: pull

- name: Run PostgreSQL container
  docker_container:
    name: "{{ postgres_container_name }}"
    image: "{{ postgres_image }}"
    restart_policy: always
    env: "{{ postgres_env }}"
    volumes:
      - "{{ postgres_data_dir }}:/var/lib/postgresql/data"
    networks:
      - name: "{{ postgres_network_name }}"
    ports: "{{ postgres_ports }}"
    state: started