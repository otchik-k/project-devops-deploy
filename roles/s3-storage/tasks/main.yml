---
- name: Create data directory
  ansible.builtin.file:
    path: "{{ minio_data_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Create config directory
  ansible.builtin.file:
    path: "/opt/minio"
    state: directory
    mode: "0755"

- name: Pull MinIO image
  community.docker.docker_image:
    name: "{{ minio_image }}"
    source: pull
    force_source: true

- name: Run MinIO container
  community.docker.docker_container:
    name: "{{ minio_container_name }}"
    image: "{{ minio_image }}"
    command: >-
      server --console-address ":{{ minio_console_port }}" /data
    restart_policy: unless-stopped
    ports:
      - "{{ minio_api_port }}:9000"
      - "{{ minio_console_port }}:{{ minio_console_port }}"
    volumes:
      - "{{ minio_data_dir }}:/data"
    env:
      MINIO_ROOT_USER: "{{ minio_root_user }}"
      MINIO_ROOT_PASSWORD: "{{ minio_root_password }}"
      MINIO_DOMAIN: "minio"
      MINIO_API_CORS_ALLOW_ORIGIN: "http://rdgw.kptech.ru:8080"
    networks:
      - name: "{{ bulletin_network_name }}"
        aliases:
          - "bulletin.minio"
    state: started
    comparisons:
      "*": strict

- name: Wait for MinIO to be ready
  ansible.builtin.uri:
    url: "http://localhost:9000/minio/health/live"
    method: GET
    return_content: true
    status_code: 200
  register: minio_health
  retries: 10
  delay: 3
  until: minio_health.status == 200

- name: Create MinIO bucket
  ansible.builtin.command: >
    docker run --rm --network {{ bulletin_network_name }}
    --entrypoint sh
    -e MC_HOST_minio="http://{{ minio_root_user }}:{{ minio_root_password }}@{{ minio_container_name }}:9000"
    quay.io/minio/mc:latest
    -c "mc mb minio/{{ minio_bucket_name }} --ignore-existing && mc anonymous set download minio/{{ minio_bucket_name }} || true"
  changed_when: false