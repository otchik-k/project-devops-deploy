- name: Install Docker SDK for Python
  apt:
    name: python3-docker
    state: present
    update_cache: yes

#- name: Create application base directory
#  file:
#    path: "{{ app_base_dir }}"
#    state: directory
#    owner: root
#    group: root
#    mode: '0755'

# 3. Создание каталога для данных (владелец — appuser)
- name: Create data directory
  file:
    path: "{{ app_data_dir }}"
    state: directory
    owner: 1001
    group: 1001
    mode: '0755'

# 4. Создание каталога для логов (владелец — appuser)
- name: Create logs directory
  file:
    path: "{{ app_logs_dir }}"
    state: directory
    owner: 1001
    group: 1001
    mode: '0755'

# пул образа
- name: Pull latest image from Docker Hub
  community.docker.docker_image:
    name: "{{ image_name }}"
    tag: "{{ image_tag }}"
    source: pull
    force_source: yes

# Запуск контейнера
- name: Run bulletin-board container
  community.docker.docker_container:
    name: "{{ container_name }}"
    image: "{{ image_name }}:{{ image_tag }}"
    state: started
    recreate: yes
    restart_policy: unless-stopped
    networks:
      - name: bulletin-network
    ports: "{{ app_ports }}"
    volumes:
      - "{{ app_data_dir }}:{{ container_data_dir }}"
      - "{{ app_logs_dir }}:{{ container_logs_dir }}"
    env:
      JAVA_OPTS: "{{ java_opts | string }}"
      SPRING_PROFILES_ACTIVE: "{{ spring_profile | default('dev') | string }}"
      STORAGE_S3_BUCKET: "{{ storage_s3_bucket | default(omit) }}"
      STORAGE_S3_REGION: "{{ storage_s3_region | default(omit) }}"
      STORAGE_S3_ACCESSKEY: "{{ storage_s3_accesskey | default(omit) }}"
      STORAGE_S3_SECRETKEY: "{{ storage_s3_secretkey | default(omit) }}"
      STORAGE_S3_ENDPOINT: "{{ storage_s3_endpoint | default(omit) }}"
      STORAGE_S3_CDNURL: "{{ storage_s3_cdnurl | default(omit) }}"
      SPRING_DATASOURCE_URL: "{{ spring_datasource_url | default(omit) }}"
      SPRING_DATASOURCE_USERNAME: "{{ spring_datasource_username | default(omit) }}"
      SPRING_DATASOURCE_PASSWORD: "{{ spring_datasource_password | default(omit) }}"
    