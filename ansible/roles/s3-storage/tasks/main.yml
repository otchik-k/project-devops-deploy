---
- name: Create data directory
  ansible.builtin.file:
    path: "{{ minio_data_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Create config directory
  ansible.builtin.file:
    path: "/opt/minio"
    state: directory
    mode: "0755"

- name: Pull MinIO image
  community.docker.docker_image:
    name: "{{ minio_image }}"
    source: pull
    force_source: true

- name: Run MinIO container
  community.docker.docker_container:
    name: "{{ minio_container_name }}"
    image: "{{ minio_image }}"
    command: >-
      server --console-address ":{{ minio_console_port }}" /data
    restart_policy: unless-stopped
    volumes:
      - "{{ minio_data_dir }}:/data"
    env:
      MINIO_ROOT_USER: "{{ minio_root_user }}"
      MINIO_ROOT_PASSWORD: "{{ minio_root_password }}"
      MINIO_DOMAIN: "{{ domain }}"
    networks:
      - name: "{{ bulletin_network_name }}"
        aliases:
          - "bulletin.minio"
    ports: "127.0.0.1:{{ minio_api_port }}:{{ minio_api_port }}"
    state: started
    comparisons:
      "*": strict

- name: Create MinIO bucket
  ansible.builtin.command: >
    docker run --rm --network {{ bulletin_network_name }}
    --entrypoint sh
    -e MC_HOST_minio="http://{{ minio_root_user }}:{{ minio_root_password }}@{{ minio_container_name }}:9000"
    quay.io/minio/mc:latest
    -c "mc mb minio/{{ minio_bucket_name }} --ignore-existing && mc anonymous set download minio/{{ minio_bucket_name }} || true"
  changed_when: false