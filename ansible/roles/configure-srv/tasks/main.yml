- name: Install required packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - software-properties-common
      - ufw
      - python3-psycopg2
    state: present
    update_cache: yes

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# --- FIREWALL (UFW) ---

- name: Set default UFW policy to deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: Set default UFW policy to allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Allow SSH access
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp

- name: Allow HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ web_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled