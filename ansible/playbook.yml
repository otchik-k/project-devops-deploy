---
- name: Deploy app
  hosts: my_hosts
  become: true

  pre_tasks:
    - name: Check if SSL certificate exists
      stat:
        path: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
      register: ssl_cert

    - name: Set HTTP-only vhosts (no cert yet)
      set_fact:
        nginx_vhosts: "{{ nginx_vhosts_http_only }}"
      when: not ssl_cert.stat.exists

    - name: Set full vhosts (cert already exists)
      set_fact:
        nginx_vhosts: "{{ nginx_vhosts_full }}"
      when: ssl_cert.stat.exists

  roles:
    - configure-srv
    - geerlingguy.docker
    - deploy-sql
    - s3-storage
    - deploy-app
    - nginx
    - certbot
    - geerlingguy.node_exporter

  post_tasks:
      - name: Check if SSL was just issued
        stat:
          path: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
        register: ssl_cert_now

      - name: Reconfigure Nginx with HTTPS (cert just issued)
        block:
          - name: Switch to full vhosts
            set_fact:
              nginx_vhosts: "{{ nginx_vhosts_full }}"

          - name: Re-run nginx role with HTTPS config
            include_role:
              name: nginx

          - name: Reload Nginx
            service:
              name: nginx
              state: reloaded
        when: not ssl_cert.stat.exists and ssl_cert_now.stat.exists

      - name: Create certbot renewal deploy hook
        copy:
          dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
          content: |
            #!/bin/bash
            systemctl reload nginx
          mode: '0755'