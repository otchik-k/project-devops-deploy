name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Настройка JDK 21 (под образ из Dockerfile)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 2. Сборка проекта Gradle — создаёт build/libs/*.jar
    - name: Build with Gradle
      run: |
        chmod +x ./gradlew
        ./gradlew clean build -x test

    # 3. Сборка Docker-образа (локально, без пуша)
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        load: true
        tags: otchikk/project-bulletin-board:test

    # 4. Запуск контейнера для тестирования
    - name: Run container for testing
      run: |
        docker run -d --name test-container -p 8080:8080 -p 9090:9090 otchikk/project-bulletin-board:test
        echo "Waiting for application to start..."
        sleep 20

    # 5. Проверка Actuator endpoint
    - name: Check Actuator Health
      run: |
        curl --fail --retry 5 --retry-delay 5 http://localhost:9090/actuator/health | grep '"status":"UP"'

    # 6. Остановка и удаление контейнера
    - name: Cleanup container
      if: always()
      run: |
        docker stop test-container || true
        docker rm test-container || true

    # 7. Логин и Push в Docker Hub (только при push в main)
    - name: Log in to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push final image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          otchikk/project-bulletin-board:latest
          otchikk/project-bulletin-board:${{ github.sha }}
