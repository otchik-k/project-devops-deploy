name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Сборка Docker-образа (мультистадийный Dockerfile сам собирает и фронт, и бэк)
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        load: true
        tags: otchikk/project-bulletin-board:test

    # 2. Запуск контейнера для тестирования
    - name: Run container for testing
      run: |
        docker run -d --name test-container \
          -p 8080:8080 -p 9090:9090 \
          -e JAVA_OPTS="-Xms256m -Xmx512m" \
          otchikk/project-bulletin-board:test
        echo "Waiting for application to start..."

    # 3. Проверка Actuator endpoint (с retry-connrefused)
    - name: Check Actuator Health
      run: |
        curl --fail --retry 15 --retry-delay 5 --retry-connrefused \
          http://localhost:9090/actuator/health | grep '"status":"UP"'

    # 4. Логи при失败 — покажет, почему приложение не поднялось
    - name: Dump container logs on failure
      if: failure()
      run: docker logs test-container

    # 5. Остановка и удаление контейнера
    - name: Cleanup container
      if: always()
      run: |
        docker stop test-container || true
        docker rm test-container || true

    # 6. Логин и Push в Docker Hub (только при push в main)
    - name: Log in to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push final image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          otchikk/project-bulletin-board:latest
          otchikk/project-bulletin-board:${{ github.sha }}
